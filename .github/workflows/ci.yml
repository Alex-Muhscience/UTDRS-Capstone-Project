name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MONGODB_URI: mongodb://localhost:27017

jobs:
  api-gateway:
    name: API gateway tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api-gateway/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  core-engine:
    name: Core engine tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: services/core-engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-engine/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  system:
    name: System test (gateway + core engine)
    needs: [api-gateway, core-engine]
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/*/requirements*.txt
      # Separate environments: each service runs with exactly its own dependencies.
      - run: |
          python -m venv "$RUNNER_TEMP/gateway"
          "$RUNNER_TEMP/gateway/bin/pip" install -r services/api-gateway/requirements-dev.txt
          python -m venv "$RUNNER_TEMP/engine"
          "$RUNNER_TEMP/engine/bin/pip" install -r services/core-engine/requirements.txt
      - run: scripts/system-test.sh
        env:
          GATEWAY_PYTHON: ${{ runner.temp }}/gateway/bin/python
          ENGINE_PYTHON: ${{ runner.temp }}/engine/bin/python

  frontend:
    name: Dashboard checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Nothing known-vulnerable ships to browsers; tooling may not carry high or critical issues.
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api-contract:
    name: API contract (gateway schema and dashboard types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api-gateway/requirements.txt
      - run: pip install -r services/api-gateway/requirements.txt
      - run: python services/api-gateway/scripts/export_openapi.py
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run gen:api
        working-directory: frontend
      - name: Committed schema and types match the gateway
        run: |
          git diff --exit-code -- services/api-gateway/openapi.json frontend/src/api/schema.d.ts || {
            echo "::error::The gateway's API changed. Run scripts/export_openapi.py and npm run gen:api, then commit the results."
            exit 1
          }

  e2e:
    name: Dashboard end-to-end (Playwright)
    needs: [api-gateway, core-engine, frontend]
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/*/requirements*.txt
      - run: |
          python -m venv "$RUNNER_TEMP/gateway"
          "$RUNNER_TEMP/gateway/bin/pip" install -r services/api-gateway/requirements.txt
          python -m venv "$RUNNER_TEMP/engine"
          "$RUNNER_TEMP/engine/bin/pip" install -r services/core-engine/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: scripts/run-stack.sh npm --prefix frontend run test:e2e
        env:
          GATEWAY_PYTHON: ${{ runner.temp }}/gateway/bin/python
          ENGINE_PYTHON: ${{ runner.temp }}/engine/bin/python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  scanner:
    name: Scanner build (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libmongoc-dev libbson-dev libjansson-dev pkg-config
      - run: make

  data-processor:
    name: Data processor checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-processor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile data-processor.py config.py

  compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Secrets for this run
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=$|JWT_SECRET=$(openssl rand -hex 32)|; s|^INTERNAL_API_TOKEN=$|INTERNAL_API_TOKEN=$(openssl rand -hex 32)|; s|^ADMIN_PASSWORD=$|ADMIN_PASSWORD=$(openssl rand -hex 16)|" .env
      - name: Development certificates for the scanner
        working-directory: scanner/configs
        run: |
          mkdir -p certs && cd certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 2 -subj "/CN=UTDRS CI CA"
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=localhost"
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 2 -extfile <(printf "subjectAltName=DNS:localhost")
          openssl req -newkey rsa:2048 -nodes -keyout agent.key -out agent.csr -subj "/CN=agent-ci"
          openssl x509 -req -in agent.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out agent.crt -days 2
          chmod 644 server.key
      - run: docker compose --profile pipeline --profile scanner up -d --build --wait
      - run: docker compose run --rm seed
      - name: Every service answers
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:5000/health
          reply=$( (printf 'SCAN not-json'; sleep 2) | timeout 10 openssl s_client -quiet -connect localhost:8443 -servername localhost \
            -cert scanner/configs/certs/agent.crt -key scanner/configs/certs/agent.key -CAfile scanner/configs/certs/ca.crt 2>/dev/null || true)
          echo "scanner replied: $reply"
          echo "$reply" | grep -q INVALID_JSON
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: End-to-end tests against the containers
        run: npx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
      - if: failure()
        run: docker compose --profile pipeline --profile scanner logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-playwright-report
          path: frontend/playwright-report
          retention-days: 7
