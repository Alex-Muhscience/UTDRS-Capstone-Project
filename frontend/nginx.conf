server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Cache control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Admin routes
    location /admin/dashboard {
        try_files /admin/dashboard.html =404;
    }
    location /admin/users {
        try_files /admin/users.html =404;
    }
    location /admin/analytics {
        try_files /admin/analytics.html =404;
    }
    location /admin/reports {
        try_files /admin/reports.html =404;
    }
    location /admin/support {
        try_files /admin/support.html =404;
    }
    location /admin/settings {
        try_files /admin/settings.html =404;
    }
    
    # User routes
    location /user/dashboard {
        try_files /user/dashboard.html =404;
    }
    location /user/profile {
        try_files /user/profile.html =404;
    }
    location /user/reports {
        try_files /user/reports.html =404;
    }
    location /user/devices {
        try_files /user/devices.html =404;
    }
    location /user/vulnerabilities {
        try_files /user/vulnerabilities.html =404;
    }
    location /user/threats {
        try_files /user/threats.html =404;
    }
    location /user/settings {
        try_files /user/settings.html =404;
    }
    
    # Auth routes
    location /login {
        try_files /login.html =404;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 403 /403.html;
    
    # API proxy
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # WebSocket proxy
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Fallback for SPA-like behavior within each page
    location / {
        try_files $uri $uri/ /index.html;
    }
}